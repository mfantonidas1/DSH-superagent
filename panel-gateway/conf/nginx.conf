# 用户级 nginx 实例：给 superagent 面板（dsh --profile superagent，回环 127.0.0.1:3082）
# 加一层「用户名 + 密码」门禁，作为局域网访问入口。照 dsh-gateway 的模式搭建。
#
# 用法（prefix 就是本目录的上一级）：
#   nginx -p ~/dsh-workspace/panel-gateway -c conf/nginx.conf              # 启动（daemon 化）
#   nginx -p ~/dsh-workspace/panel-gateway -c conf/nginx.conf -s reload     # 改配置 / 换 token 后重载
#   nginx -p ~/dsh-workspace/panel-gateway -c conf/nginx.conf -s quit       # 优雅停止
#   nginx -p ~/dsh-workspace/panel-gateway -c conf/nginx.conf -t            # 语法检查
#
# 不写 `daemon off;`：systemd 单元用 `-g 'daemon off;'` 传入，手工跑则默认后台。
# 全部运行时文件（pid / 日志 / 临时目录）都落在 prefix 下，不需要 root。
#
# 与 dsh-gateway 的唯一本质区别 —— Host 头的处理：
#   dsh-gateway 的后端绑在局域网 IP（172.16.2.238:3080），DSH 的 Host 栅栏
#   （@deepseek-ai/dsh-client-connection 的 isTrustedApiRequest）接受「绑定地址
#   本身、忽略端口」，所以那边 Host 原样透传即可。
#   本面板保持回环绑定 127.0.0.1:3082，浏览器从局域网进来的 Host 是
#   172.16.2.238:3083 —— 既不是回环、也不是绑定地址、也不在 trustedHosts
#   （默认空），透传会让每个 /api 请求被 403。改 trustedHosts 需要重启面板，
#   而面板进程里跑着 superagent 编排器与活动会话，不能为了进门去重启它。
#   因此这里把 Host 统一改写成回环 authority 127.0.0.1:3082：
#     · Host 栅栏：回环 hostname 恒被接受（任何端口）；
#     · cookie：名字与签名都按 Host 头推导的 authority 计算，改写是恒定的，
#       下发与校验两侧一致；浏览器侧 cookie 按主机名（172.16.2.238）存储，
#       不区分端口，每次都会带回来；
#     · Origin 栅栏：浏览器发来的 Origin 是入口 authority，必须同步改写成
#       回环 authority 才能与 Host 一致（isSameAuthorityOrigin）。只改写
#       「本入口自己的 Origin」，外来 Origin 原样透传、由 DSH 栅栏拒绝，
#       不削弱跨站防护（另有 SameSite=Strict cookie 与 Sec-Fetch-Site 兜底）。
#   对 DSH 本体零改动：配置、进程、回环绑定都不动。

pid         /home/jxdxyfzx/dsh-workspace/panel-gateway/logs/nginx.pid;
error_log   /home/jxdxyfzx/dsh-workspace/panel-gateway/logs/error.log warn;
worker_processes 1;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
}

http {
    include     /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志故意只记 $uri 不记 $request_uri：query string 里可能带 launch token，
    # 落进 access.log 等于把凭据写进磁盘。
    log_format gateway '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
    access_log  /home/jxdxyfzx/dsh-workspace/panel-gateway/logs/access.log gateway;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  75s;
    server_tokens      off;

    # ---- 临时目录必须显式指到 prefix 下（否则必炸）----
    # *_temp_path 若不写，用的是编译期绝对路径 /var/lib/nginx/…（root 所有），
    # 用户级 nginx 写不进去：大响应落盘失败被中途掐断（白屏但 access.log 全 200），
    # 大附件上传直接 500。详见 dsh-gateway README 的同名段落。
    proxy_temp_path       /home/jxdxyfzx/dsh-workspace/panel-gateway/data/proxy  1 2;
    client_body_temp_path /home/jxdxyfzx/dsh-workspace/panel-gateway/data/body   1 2;
    fastcgi_temp_path     /home/jxdxyfzx/dsh-workspace/panel-gateway/data/misc;
    uwsgi_temp_path       /home/jxdxyfzx/dsh-workspace/panel-gateway/data/misc;
    scgi_temp_path        /home/jxdxyfzx/dsh-workspace/panel-gateway/data/misc;

    # WebSocket 升级：非升级请求发 Connection: close。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Origin 改写：只认本入口自己的 authority；其余（含缺失）原样透传。
    # 值为空串时 nginx 不会向后端发送该头。换入口地址/端口时这里要一起改。
    map $http_origin $panel_origin {
        default                     $http_origin;
        ""                          "";
        "http://172.16.2.238:3083"  "http://127.0.0.1:3082";
    }

    upstream panel_backend {
        server 127.0.0.1:3082;
    }

    server {
        listen 172.16.2.238:3083;

        # ---- 用户名 / 密码在这里面 ----
        auth_basic           "DeepSeek Harness";
        auth_basic_user_file /home/jxdxyfzx/dsh-workspace/panel-gateway/conf/htpasswd;

        # DSH 的默认请求体上限约 300MB（图片附件），代理不能比它小。
        client_max_body_size 400m;

        proxy_http_version 1.1;
        # 见文件头：回环后端必须把 Host/Origin 恒定改写成回环 authority，
        # cookie 的 authority 绑定与 Host/Origin 栅栏才能同时成立。
        proxy_set_header Host              127.0.0.1:3082;
        proxy_set_header Origin            $panel_origin;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务 / 流式输出：一次回答可能跑很久。
        proxy_connect_timeout 10s;
        proxy_send_timeout    2h;
        proxy_read_timeout    2h;

        # 由 bin/refresh-token.sh 生成，内容是一行：
        #   set $dsh_launch_token "…";
        include /home/jxdxyfzx/dsh-workspace/panel-gateway/conf/token.conf;

        # 根路径导航：以 DSH 的真实响应为准 —— 它回 401 就用一次内部子请求
        # 补 token 交换（同 dsh-gateway：不靠 cookie 名猜认证状态，避免
        # 「浏览器按主机名发 cookie、跨端口外来 cookie 造成误判」的事故）。
        location = / {
            proxy_intercept_errors on;
            error_page 401 = @dsh_bootstrap;
            proxy_pass http://panel_backend;
        }

        # 内部引导座位，只服务上面那一次 401，外部不可直接访问。
        # proxy_intercept_errors off 是断递归的关键：否则这里收到的 401 会再次
        # 触发 error_page，子请求递归直到 500。token 真失效时把 401 原样交给浏览器。
        # 跨站导航不做 token 交换（login-CSRF 加固）：DSH 的 authorizeIndex 不查
        # Origin/Sec-Fetch-Site，若浏览器缓存了 Basic 凭据，跨站顶层导航也能触发
        # 引导并铸出会话 cookie。这里对 Sec-Fetch-Site: cross-site 直接回 401。
        location @dsh_bootstrap {
            internal;
            proxy_intercept_errors off;
            if ($http_sec_fetch_site = "cross-site") { return 401; }
            rewrite ^ /?token=$dsh_launch_token break;
            proxy_pass http://panel_backend;
        }

        # 其余路径（/assets、/api、/api/remote.mux WebSocket、终端与文件接口等）原样转发。
        # 这里不做引导：token 只认 pathname "/"，把 WS/API 的 401 重写成首页会让握手拿到 HTML。
        # 会话 cookie 掉了的话，重新导航首页即自愈。
        location / {
            proxy_pass http://panel_backend;
        }
    }

}